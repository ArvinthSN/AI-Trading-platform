[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nextrade-intelligence-api"
version = "0.1.0"
description = "NEXTRADE market and global intelligence API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "langchain-core>=1,<2",
  "openai>=1.99,<3",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]
